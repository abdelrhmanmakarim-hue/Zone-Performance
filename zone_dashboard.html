<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Performance Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        .kpi-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-left: 4px solid #667eea;
        }
        .kpi-value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Zone Performance Dashboard</h1>
            <p>Real-time analytics for delivery operations</p>
        </div>
        <div class="kpi-grid">
            <div class="kpi-card">
                <div>Total Orders</div>
                <div class="kpi-value">25,000+</div>
            </div>
            <div class="kpi-card">
                <div>Avg Delivery Time</div>
                <div class="kpi-value">27.5m</div>
            </div>
            <div class="kpi-card">
                <div>On-Time %</div>
                <div class="kpi-value">82.5%</div>
            </div>
            <div class="kpi-card">
                <div>Fill Rate</div>
                <div class="kpi-value">85%</div>
            </div>
        </div>
    </div>
</body>
</html>
