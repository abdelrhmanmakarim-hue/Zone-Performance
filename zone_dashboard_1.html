<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zone Performance Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        
        .header h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 32px;
        }
        
        .header p {
            color: #666;
            font-size: 14px;
        }
        
        .controls {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        
        select, input {
            padding: 10px 15px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        
        button {
            padding: 10px 20px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 30px;
        }
        
        .kpi-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            border-left: 4px solid #667eea;
        }
        
        .kpi-label {
            color: #999;
            font-size: 12px;
            text-transform: uppercase;
            margin-bottom: 8px;
        }
        
        .kpi-value {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
        }
        
        .kpi-change {
            font-size: 12px;
            color: #10b981;
        }
        
        .kpi-change.negative {
            color: #ef4444;
        }
        
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(500px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .chart-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: #333;
            margin-bottom: 15px;
        }
        
        .table-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.08);
            overflow: hidden;
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
        }
        
        th {
            background: #f8f9fa;
            padding: 15px;
            text-align: right;
            font-weight: 600;
            color: #333;
            border-bottom: 2px solid #e9ecef;
            font-size: 13px;
        }
        
        td {
            padding: 15px;
            border-bottom: 1px solid #e9ecef;
            color: #666;
            font-size: 13px;
        }
        
        tr:hover {
            background: #f8f9fa;
        }
        
        .zone-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }
        
        .zone-south {
            background: #dbeafe;
            color: #0c4a6e;
        }
        
        .zone-north {
            background: #ddd6fe;
            color: #4c1d95;
        }
        
        .zone-golden {
            background: #fef3c7;
            color: #78350f;
        }
        
        .zone-rehab {
            background: #dbeafe;
            color: #0c4a6e;
        }
        
        .metric-good {
            color: #10b981;
            font-weight: 600;
        }
        
        .metric-warning {
            color: #f59e0b;
            font-weight: 600;
        }
        
        .metric-bad {
            color: #ef4444;
            font-weight: 600;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: white;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 Zone Performance Dashboard</h1>
            <p>Real-time analytics for delivery operations across all zones</p>
            
            <div class="controls">
                <select id="zoneSelect">
                    <option value="">All Zones</option>
                    <option value="Tagammoa south">Tagammoa South</option>
                    <option value="Tagammoa north">Tagammoa North</option>
                    <option value="Tagammoa golden square">Tagammoa Golden Square</option>
                    <option value="El rehab city">El Rehab City</option>
                </select>
                
                <select id="weekSelect">
                    <option value="">All Weeks</option>
                    <option value="15">Week 15</option>
                    <option value="16">Week 16</option>
                    <option value="17">Week 17</option>
                    <option value="18">Week 18</option>
                    <option value="19">Week 19</option>
                    <option value="20">Week 20</option>
                </select>
                
                <button onclick="updateDashboard()">Apply Filters</button>
                <button onclick="resetFilters()">Reset</button>
            </div>
        </div>
        
        <div class="kpi-grid" id="kpiGrid"></div>
        
        <div class="charts-grid">
            <div class="chart-card">
                <div class="chart-title">Orders by Zone</div>
                <div style="position: relative; height: 300px;">
                    <canvas id="ordersChart"></canvas>
                </div>
            </div>
            
            <div class="chart-card">
                <div class="chart-title">Performance Metrics</div>
                <div style="position: relative; height: 300px;">
                    <canvas id="performanceChart"></canvas>
                </div>
            </div>
        </div>
        
        <div class="table-container">
            <table id="dataTable">
                <thead>
                    <tr>
                        <th>Zone</th>
                        <th>Date</th>
                        <th>Orders</th>
                        <th>Riders</th>
                        <th>Avg Delivery (min)</th>
                        <th>On-Time %</th>
                        <th>Rating</th>
                        <th>Fill Rate</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
    
    <script>
        let allData = [];
        let chartsInstance = {};
        
        // Parse CSV Data
        function parseData(csvText) {
            const lines = csvText.trim().split('\n');
            const data = [];
            
            for (let i = 1; i < lines.length; i++) {
                const cells = lines[i].split('|').map(c => c.trim()).filter(c => c);
                if (cells.length < 5) continue;
                
                const row = {
                    week: cells[1],
                    zone: cells[2],
                    date: cells[3],
                    failRate: parseFloat(cells[4]) || 0,
                    transportFailRate: parseFloat(cells[5]) || 0,
                    utr: parseFloat(cells[6]) || 0,
                    deliveryTime: parseFloat(cells[7]) || 0,
                    onTimePercent: parseFloat(cells[8]?.replace('%', '')) || 0,
                    acceptanceRate: parseFloat(cells[9]?.replace('%', '')) || 0,
                    workingHours: parseFloat(cells[10]) || 0,
                    breakHours: parseFloat(cells[11]?.replace('%', '')) || 0,
                    riderAcceptingTime: parseFloat(cells[12]) || 0,
                    ordersCompleted: parseInt(cells[13]) || 0,
                    activeRiders: parseInt(cells[14]) || 0,
                    avgWH: parseFloat(cells[15]) || 0,
                    fillRate: parseFloat(cells[20]?.replace('%', '')) || 0,
                    runRate: parseFloat(cells[23]?.replace('%', '')) || 0
                };
                
                if (row.zone && row.date) {
                    data.push(row);
                }
            }
            
            return data;
        }
        
        // Load and initialize
        async function loadDashboard() {
            try {
                // Using the data from the Google Sheet (simplified for demo)
                // In production, you'd use Google Sheets API
                const mockData = generateMockData();
                allData = mockData;
                
                updateDashboard();
            } catch (error) {
                console.error('Error loading data:', error);
            }
        }
        
        function generateMockData() {
            // Generate mock data based on the structure
            const zones = ['Tagammoa south', 'Tagammoa north', 'Tagammoa golden square', 'El rehab city'];
            const data = [];
            
            zones.forEach(zone => {
                for (let w = 15; w <= 20; w++) {
                    for (let d = 6; d <= 10; d++) {
                        data.push({
                            week: w,
                            zone: zone,
                            date: `4/${d}/2026`,
                            deliveryTime: 25 + Math.random() * 10,
                            onTimePercent: 70 + Math.random() * 15,
                            ordersCompleted: 5000 + Math.random() * 10000,
                            activeRiders: 300 + Math.random() * 500,
                            fillRate: 70 + Math.random() * 25,
                            acceptanceRate: 95 + Math.random() * 4,
                            utr: 1.7 + Math.random() * 0.5
                        });
                    }
                }
            });
            
            return data;
        }
        
        function updateDashboard() {
            const zone = document.getElementById('zoneSelect').value;
            const week = document.getElementById('weekSelect').value;
            
            let filteredData = allData;
            
            if (zone) {
                filteredData = filteredData.filter(d => d.zone === zone);
            }
            
            if (week) {
                filteredData = filteredData.filter(d => d.week === parseInt(week));
            }
            
            updateKPIs(filteredData);
            updateCharts(filteredData);
            updateTable(filteredData);
        }
        
        function updateKPIs(data) {
            if (data.length === 0) return;
            
            const avgDelivery = (data.reduce((a, b) => a + b.deliveryTime, 0) / data.length).toFixed(1);
            const avgOnTime = (data.reduce((a, b) => a + b.onTimePercent, 0) / data.length).toFixed(1);
            const totalOrders = data.reduce((a, b) => a + b.ordersCompleted, 0);
            const avgFillRate = (data.reduce((a, b) => a + b.fillRate, 0) / data.length).toFixed(1);
            
            const html = `
                <div class="kpi-card">
                    <div class="kpi-label">Average Delivery Time</div>
                    <div class="kpi-value">${avgDelivery}m</div>
                    <div class="kpi-change">Target: 25-30 min</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">On-Time Percentage</div>
                    <div class="kpi-value">${avgOnTime}%</div>
                    <div class="kpi-change">Target: >80%</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Total Orders</div>
                    <div class="kpi-value">${(totalOrders/1000).toFixed(1)}k</div>
                    <div class="kpi-change">Period total</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Fill Rate</div>
                    <div class="kpi-value">${avgFillRate}%</div>
                    <div class="kpi-change">Target: >80%</div>
                </div>
            `;
            
            document.getElementById('kpiGrid').innerHTML = html;
        }
        
        function updateCharts(data) {
            const zoneData = {};
            data.forEach(row => {
                if (!zoneData[row.zone]) {
                    zoneData[row.zone] = { orders: 0, delivery: 0, count: 0 };
                }
                zoneData[row.zone].orders += row.ordersCompleted;
                zoneData[row.zone].delivery += row.deliveryTime;
                zoneData[row.zone].count += 1;
            });
            
            const zones = Object.keys(zoneData);
            const orders = Object.values(zoneData).map(z => z.orders);
            const deliveryTimes = Object.values(zoneData).map(z => (z.delivery / z.count).toFixed(1));
            
            // Orders Chart
            if (chartsInstance.orders) chartsInstance.orders.destroy();
            chartsInstance.orders = new Chart(document.getElementById('ordersChart'), {
                type: 'bar',
                data: {
                    labels: zones,
                    datasets: [{
                        label: 'Orders Completed',
                        data: orders,
                        backgroundColor: ['#667eea', '#764ba2', '#f093fb', '#4facfe'],
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { y: { beginAtZero: true } }
                }
            });
            
            // Performance Chart
            if (chartsInstance.performance) chartsInstance.performance.destroy();
            chartsInstance.performance = new Chart(document.getElementById('performanceChart'), {
                type: 'line',
                data: {
                    labels: zones,
                    datasets: [{
                        label: 'Avg Delivery Time (min)',
                        data: deliveryTimes,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.1)',
                        borderWidth: 2,
                        fill: true,
                        pointRadius: 6,
                        pointBackgroundColor: '#667eea'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: true } },
                    scales: { y: { beginAtZero: true } }
                }
            });
        }
        
        function updateTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = '';
            
            data.slice(0, 20).forEach(row => {
                const tr = document.createElement('tr');
                const zoneBadgeClass = row.zone.includes('south') ? 'zone-south' : 
                                      row.zone.includes('north') ? 'zone-north' :
                                      row.zone.includes('golden') ? 'zone-golden' : 'zone-rehab';
                
                const deliveryClass = row.deliveryTime < 28 ? 'metric-good' : 'metric-warning';
                const onTimeClass = row.onTimePercent > 80 ? 'metric-good' : 'metric-warning';
                
                tr.innerHTML = `
                    <td><span class="zone-badge ${zoneBadgeClass}">${row.zone}</span></td>
                    <td>${row.date}</td>
                    <td>${row.ordersCompleted.toLocaleString()}</td>
                    <td>${row.activeRiders}</td>
                    <td class="${deliveryClass}">${row.deliveryTime.toFixed(1)}m</td>
                    <td class="${onTimeClass}">${row.onTimePercent.toFixed(1)}%</td>
                    <td>4.7⭐</td>
                    <td>${row.fillRate.toFixed(0)}%</td>
                `;
                tbody.appendChild(tr);
            });
        }
        
        function resetFilters() {
            document.getElementById('zoneSelect').value = '';
            document.getElementById('weekSelect').value = '';
            updateDashboard();
        }
        
        // Initialize
        window.addEventListener('load', loadDashboard);
    </script>
</body>
</html>
